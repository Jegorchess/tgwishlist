services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wishlist}
      POSTGRES_DB: wishlist
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Reachable only from this machine: local dev (uvicorn, alembic) connects here.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wishlist:${POSTGRES_PASSWORD:-wishlist}@db:5432/wishlist
      MEDIA_DIR: /data/media
    volumes:
      - media-data:/data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  db-data:
  media-data:
  caddy-data:
