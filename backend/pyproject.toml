[project]
name = "tgwishlist-backend"
version = "0.1.0"
description = "Backend and bot for the family wishlist Telegram Mini App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.ruff]
extend-exclude = ["migrations/versions"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
